<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فيديو تفاعلي - لقطات مخصصة</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            direction: rtl;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e14;
            color: #f0f4fa;
            overflow-x: hidden;
        }

        #bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            background: #0a0f15;
        }

        #bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85) saturate(1.1);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
            pointer-events: none;
            backdrop-filter: blur(1.5px);
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            z-index: 100;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        .scenes-progress {
            position: fixed;
            top: 15px;
            right: 50%;
            transform: translateX(50%);
            z-index: 100;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .scene-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            border: 2px solid transparent;
        }

        .scene-dot.active {
            background: #00d2ff;
            border-color: #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            transform: scale(1.2);
        }

        .scene-dot.visited {
            background: #3a7bd5;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem 2rem;
            text-align: center;
            width: 100%;
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .section h2 {
            font-size: clamp(2.4rem, 7vw, 4.6rem);
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, #ffffff 0%, #c0d0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            transform: translateY(40px) scale(0.9);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .section p {
            font-size: 1.3rem;
            max-width: 700px;
            line-height: 1.8;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateX(-60px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
        }

        .section .time-range {
            font-size: 0.9rem;
            color: #00d2ff;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem 1.2rem;
            border-radius: 20px;
            margin-top: 0.5rem;
            border: 1px solid rgba(0, 210, 255, 0.2);
            opacity: 0;
            transition: all 0.8s ease 0.4s;
        }

        .section.active h2 {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .section.active p {
            opacity: 1;
            transform: translateX(0);
        }

        .section.active .time-range {
            opacity: 1;
        }

        .scene-number {
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
            letter-spacing: 3px;
            opacity: 0;
            transition: all 0.6s ease;
        }

        .section.active .scene-number {
            opacity: 1;
        }

        .scroll-hint {
            margin-top: 2.5rem;
            font-size: 1rem;
            letter-spacing: 2px;
            color: #b8cae0;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.6rem 2rem;
            border-radius: 60px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: pulse 2s infinite;
            opacity: 0;
            transform: scale(0.7);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s;
        }

        .section.active .scroll-hint {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            color: #b8cae0;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            display: inline-block;
            animation: blink 1.5s infinite;
        }

        .status-dot.paused {
            background: #ff6b6b;
            animation: none;
        }

        .status-dot.slow {
            background: #ffd93d;
            animation: pulse-slow 1s infinite;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .time-display {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 5px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
            color: #8899bb;
            font-family: monospace;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .time-display.visible {
            opacity: 1;
        }

        .footer {
            height: 30vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: #a0b4d0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        .scene-end-notification {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            z-index: 100;
            background: rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(12px);
            padding: 8px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            font-size: 0.9rem;
            color: #ffd93d;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .scene-end-notification.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        @media (max-width: 700px) {
            .section p {
                font-size: 1rem;
                padding: 0.6rem 1.2rem;
            }
            .scroll-hint {
                font-size: 0.9rem;
                padding: 0.4rem 1.4rem;
            }
            .status-indicator {
                font-size: 0.7rem;
                padding: 6px 15px;
                bottom: 15px;
            }
            .time-display {
                bottom: 70px;
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .scenes-progress {
                top: 10px;
                padding: 5px 12px;
                gap: 6px;
            }
            .scene-dot {
                width: 8px;
                height: 8px;
            }
            .scene-number {
                font-size: 0.7rem;
                top: 10px;
                left: 15px;
            }
            .section .time-range {
                font-size: 0.7rem;
                padding: 0.2rem 0.8rem;
            }
            .scene-end-notification {
                font-size: 0.7rem;
                padding: 5px 14px;
                bottom: 110px;
            }
        }
    </style>
</head>
<body>

    <div class="progress-bar" id="progressBar"></div>
    <div class="scenes-progress" id="scenesProgress"></div>

    <div id="bg-video-container">
        <video id="bg-video" muted playsinline preload="auto">
            <source src="your-video.mp4" type="video/mp4" />
            متصفحك لا يدعم فيديو الخلفية.
        </video>
    </div>

    <div class="overlay"></div>

    <div class="content">
        <!-- الأقسام سيتم إنشاؤها بواسطة JavaScript -->
    </div>

    <div class="status-indicator" id="statusIndicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">تشغيل تلقائي</span>
    </div>

    <div class="scene-end-notification" id="sceneEndNotification">🔄 انتهت اللقطة - تعيد التشغيل من البداية</div>

    <div class="time-display" id="timeDisplay">
        <span id="currentTimeText">00:00</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ============================================
            //  بيانات اللقطات حسب الطلب
            // ============================================
            const scenesData = [
                {
                    title: '🎬 المشهد الافتتاحي',
                    desc: 'من 0 إلى 3 ثواني - مقدمة الفيديو',
                    startTime: 0,
                    endTime: 3,
                    hint: '⬇️ مرر للأسفل ⬇️'
                },
                {
                    title: '✨ المشهد الثاني',
                    desc: 'من 3 إلى 4 ثواني - لحظة سريعة',
                    startTime: 3,
                    endTime: 4,
                    hint: '✨ استمر بالتمرير'
                },
                {
                    title: '🌌 المشهد الثالث',
                    desc: 'من 6 إلى 7 ثواني - مشهد ديناميكي',
                    startTime: 6,
                    endTime: 7,
                    hint: '🚀 تابع التمرير'
                },
                {
                    title: '🎯 المشهد الرابع',
                    desc: 'من 9 إلى 10 ثواني - ذروة المشهد',
                    startTime: 9,
                    endTime: 10,
                    hint: '🎯 استمر'
                },
                {
                    title: '🌟 المشهد الخامس',
                    desc: 'نهاية الرحلة - ختام مميز',
                    startTime: 10,
                    endTime: 11,
                    hint: '🌟 نهاية الرحلة'
                }
            ];

            // ============================================
            //  عناصر DOM
            // ============================================
            const video = document.getElementById('bg-video');
            const progressBar = document.getElementById('progressBar');
            const scenesProgress = document.getElementById('scenesProgress');
            const content = document.querySelector('.content');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const timeDisplay = document.getElementById('timeDisplay');
            const currentTimeText = document.getElementById('currentTimeText');
            const sceneEndNotification = document.getElementById('sceneEndNotification');

            // ============================================
            //  متغيرات التحكم
            // ============================================
            let currentSceneIndex = 0;
            let totalScenes = scenesData.length;
            let isScrolling = false;
            let scrollTimeout = null;
            let isVideoPlaying = false;
            let lastScrollY = window.scrollY;
            let currentVideoTime = 0;
            let isSlowMode = false;
            let originalPlaybackRate = 1.0;
            const slowModeDuration = 2;
            let isSceneEnded = false;
            let sceneEndTimeout = null;
            let isLooping = false;

            // ============================================
            //  إنشاء الأقسام ونقاط التقدم
            // ============================================
            function createSections() {
                scenesData.forEach((scene, index) => {
                    const section = document.createElement('section');
                    section.className = 'section';
                    section.dataset.scene = index;
                    
                    const sceneNumber = document.createElement('div');
                    sceneNumber.className = 'scene-number';
                    sceneNumber.textContent = `لقطة ${index + 1}/${totalScenes}`;
                    section.appendChild(sceneNumber);
                    
                    const h2 = document.createElement('h2');
                    h2.textContent = scene.title;
                    section.appendChild(h2);
                    
                    const p = document.createElement('p');
                    p.textContent = scene.desc;
                    section.appendChild(p);
                    
                    const timeRange = document.createElement('div');
                    timeRange.className = 'time-range';
                    timeRange.textContent = `⏱ ${scene.startTime.toFixed(1)}ث - ${scene.endTime.toFixed(1)}ث`;
                    section.appendChild(timeRange);
                    
                    if (index < totalScenes - 1) {
                        const hint = document.createElement('div');
                        hint.className = 'scroll-hint';
                        hint.textContent = scene.hint || '⬇️ مرر للأسفل ⬇️';
                        section.appendChild(hint);
                    } else {
                        const endHint = document.createElement('div');
                        endHint.className = 'scroll-hint';
                        endHint.textContent = '🏁 نهاية الرحلة';
                        section.appendChild(endHint);
                    }
                    
                    content.appendChild(section);
                    
                    const dot = document.createElement('div');
                    dot.className = 'scene-dot';
                    dot.dataset.index = index;
                    dot.title = `${scene.title} (${scene.startTime.toFixed(1)}-${scene.endTime.toFixed(1)}ث)`;
                    dot.addEventListener('click', () => {
                        goToScene(index);
                    });
                    scenesProgress.appendChild(dot);
                });
            }

            // ============================================
            //  الانتقال إلى لقطة محددة
            // ============================================
            function goToScene(index) {
                if (index < 0) index = 0;
                if (index >= totalScenes) index = totalScenes - 1;
                
                currentSceneIndex = index;
                const scene = scenesData[index];
                isSceneEnded = false;
                isLooping = false;
                
                // إخفاء إشعار انتهاء اللقطة
                sceneEndNotification.classList.remove('show');
                
                // تحديث شريط التقدم
                const progress = (index / (totalScenes - 1)) * 100;
                progressBar.style.width = progress + '%';
                
                // تحديث نقاط التقدم
                const dots = document.querySelectorAll('.scene-dot');
                dots.forEach((dot, i) => {
                    dot.classList.remove('active', 'visited');
                    if (i === index) {
                        dot.classList.add('active');
                    } else if (i < index) {
                        dot.classList.add('visited');
                    }
                });
                
                // تحديث الأقسام
                const sections = document.querySelectorAll('.section');
                sections.forEach((section, i) => {
                    section.classList.toggle('active', i === index);
                });
                
                // تشغيل الفيديو من بداية اللقطة
                if (video.duration && scene.startTime < video.duration) {
                    video.currentTime = scene.startTime;
                    currentVideoTime = scene.startTime;
                    updateTimeDisplay(scene.startTime);
                    
                    // تشغيل بطيء لمدة ثانيتين
                    playVideoSlowFrom(scene.startTime);
                }
            }

            // ============================================
            //  تشغيل الفيديو بسرعة بطيئة
            // ============================================
            function playVideoSlowFrom(time) {
                if (time < 0) time = 0;
                if (time > video.duration) time = video.duration;

                video.currentTime = time;
                currentVideoTime = time;
                updateTimeDisplay(time);

                originalPlaybackRate = video.playbackRate || 1.0;
                const slowRate = 0.35;
                video.playbackRate = slowRate;

                video.play().then(() => {
                    isVideoPlaying = true;
                    isSlowMode = true;
                    isLooping = false;
                    
                    statusDot.className = 'status-dot slow';
                    statusText.textContent = '🐢 تشغيل بطيء';

                    setTimeout(() => {
                        if (isVideoPlaying && isSlowMode) {
                            video.playbackRate = originalPlaybackRate;
                            isSlowMode = false;
                            statusDot.className = 'status-dot';
                            statusText.textContent = '▶ تشغيل تلقائي';
                        }
                    }, slowModeDuration * 1000);

                }).catch(err => {
                    console.warn('لا يمكن تشغيل الفيديو:', err);
                });
            }

            // ============================================
            //  تحديث عرض الوقت
            // ============================================
            function updateTimeDisplay(time) {
                const minutes = Math.floor(time / 60);
                const seconds = Math.floor(time % 60);
                currentTimeText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                timeDisplay.classList.add('visible');
                clearTimeout(window.timeDisplayTimeout);
                window.timeDisplayTimeout = setTimeout(() => {
                    timeDisplay.classList.remove('visible');
                }, 3000);
            }

            // ============================================
            //  إيقاف الفيديو
            // ============================================
            function pauseVideo() {
                if (isVideoPlaying) {
                    currentVideoTime = video.currentTime;
                    video.pause();
                    isVideoPlaying = false;
                    isSlowMode = false;
                    isLooping = false;
                    video.playbackRate = originalPlaybackRate;
                    statusDot.className = 'status-dot paused';
                    statusText.textContent = `⏸ توقف عند ${currentVideoTime.toFixed(1)}ث`;
                    updateTimeDisplay(currentVideoTime);
                }
            }

            // ============================================
            //  مراقبة الفيديو - إعادة تشغيل اللقطة عند انتهائها
            // ============================================
            video.addEventListener('timeupdate', function() {
                if (isVideoPlaying && !video.paused) {
                    currentVideoTime = video.currentTime;
                    
                    // تحديث شريط التقدم
                    if (video.duration) {
                        const progress = (video.currentTime / video.duration) * 100;
                        progressBar.style.width = Math.min(progress, 100) + '%';
                    }
                    
                    // التحقق من حدود اللقطة الحالية
                    const currentScene = scenesData[currentSceneIndex];
                    if (currentScene) {
                        // إذا وصلنا إلى نهاية اللقطة
                        if (video.currentTime >= currentScene.endTime) {
                            if (!isLooping) {
                                isLooping = true;
                                isSceneEnded = true;
                                
                                // إظهار إشعار إعادة التشغيل
                                sceneEndNotification.classList.add('show');
                                sceneEndNotification.textContent = '🔄 إعادة تشغيل اللقطة';
                                
                                // إعادة تشغيل اللقطة من البداية
                                setTimeout(() => {
                                    if (isVideoPlaying) {
                                        // العودة إلى بداية اللقطة
                                        video.currentTime = currentScene.startTime;
                                        currentVideoTime = currentScene.startTime;
                                        updateTimeDisplay(currentScene.startTime);
                                        isLooping = false;
                                        isSceneEnded = false;
                                        
                                        // إخفاء الإشعار
                                        sceneEndNotification.classList.remove('show');
                                        
                                        // الاستمرار في التشغيل
                                        video.play().catch(err => console.warn('خطأ في إعادة التشغيل:', err));
                                    }
                                }, 300); // تأخير بسيط قبل إعادة التشغيل
                            }
                        }
                    }
                }
            });

            // ============================================
            //  معالجة التمرير
            // ============================================
            window.addEventListener('scroll', function() {
                const currentScrollY = window.scrollY;
                const scrollDelta = Math.abs(currentScrollY - lastScrollY);

                if (scrollDelta > 3) {
                    isScrolling = true;

                    // إيقاف الفيديو
                    if (isVideoPlaying) {
                        pauseVideo();
                    }

                    // تحديث اللقطة الحالية بناءً على التمرير
                    updateSceneFromScroll(currentScrollY);

                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => {
                        isScrolling = false;
                        
                        // عند توقف التمرير، ننتقل إلى بداية اللقطة المحددة
                        if (video.duration && currentSceneIndex < scenesData.length) {
                            const scene = scenesData[currentSceneIndex];
                            if (scene.startTime < video.duration) {
                                isLooping = false;
                                isSceneEnded = false;
                                sceneEndNotification.classList.remove('show');
                                playVideoSlowFrom(scene.startTime);
                            }
                        }
                    }, 400);
                }

                lastScrollY = currentScrollY;
            });

            // ============================================
            //  تحديث اللقطة بناءً على التمرير
            // ============================================
            function updateSceneFromScroll(scrollY) {
                const sections = document.querySelectorAll('.section');
                let activeIndex = 0;
                
                sections.forEach((section, index) => {
                    const rect = section.getBoundingClientRect();
                    const isActive = rect.top <= window.innerHeight * 0.5 && rect.bottom >= window.innerHeight * 0.3;
                    
                    if (isActive) {
                        activeIndex = index;
                    }
                });
                
                if (activeIndex !== currentSceneIndex) {
                    currentSceneIndex = activeIndex;
                    
                    // تحديث الأقسام
                    sections.forEach((section, i) => {
                        section.classList.toggle('active', i === activeIndex);
                    });
                    
                    // تحديث نقاط التقدم
                    const dots = document.querySelectorAll('.scene-dot');
                    dots.forEach((dot, i) => {
                        dot.classList.remove('active');
                        if (i === activeIndex) {
                            dot.classList.add('active');
                        } else if (i < activeIndex) {
                            dot.classList.add('visited');
                        }
                    });
                    
                    // تحديث شريط التقدم
                    const progress = (activeIndex / (totalScenes - 1)) * 100;
                    progressBar.style.width = progress + '%';
                    
                    // إعادة تعيين حالة انتهاء اللقطة
                    isLooping = false;
                    isSceneEnded = false;
                    sceneEndNotification.classList.remove('show');
                }
            }

            // ============================================
            //  تهيئة الفيديو
            // ============================================
            video.addEventListener('loadedmetadata', function() {
                console.log('✅ الفيديو جاهز، الطول:', video.duration, 'ثانية');
                originalPlaybackRate = video.playbackRate || 1.0;
                currentVideoTime = 0;
                
                createSections();
                
                setTimeout(() => {
                    goToScene(0);
                }, 500);
            });

            // ============================================
            //  أحداث إضافية
            // ============================================
            window.addEventListener('resize', function() {
                updateSceneFromScroll(window.scrollY);
            });

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && !isScrolling) {
                    const scene = scenesData[currentSceneIndex];
                    if (scene && !isSceneEnded) {
                        if (isSlowMode) {
                            playVideoSlowFrom(currentVideoTime);
                        } else {
                            playVideoSlowFrom(scene.startTime);
                        }
                    }
                }
            });

            video.addEventListener('error', function(e) {
                console.error('خطأ في الفيديو:', e);
                statusText.textContent = '⚠ خطأ في الفيديو';
                statusDot.className = 'status-dot paused';
            });

            console.log('✅ تم تهيئة الفيديو مع إعادة تشغيل اللقطات');
            console.log('📌 اللقطات المحددة:');
            scenesData.forEach((scene, i) => {
                console.log(`  لقطة ${i + 1}: ${scene.startTime}ث - ${scene.endTime}ث`);
            });
            console.log('🔄 عند انتهاء كل لقطة، تعيد التشغيل من البداية تلقائياً');
        });
    </script>

</body>
</html>
