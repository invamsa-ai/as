<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محمد الحناني - Full-Stack Developer</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        /* ===== BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            direction: rtl;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0e17;
            color: #e8edf5;
            overflow-x: hidden;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0e17;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00d2ff, #3a7bd5);
            border-radius: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== VIDEO BACKGROUND ===== */
        #bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            background: #0a0f15;
        }

        #bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.6) saturate(0.9);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
            pointer-events: none;
            backdrop-filter: blur(2px);
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            z-index: 100;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        /* ===== SCENES PROGRESS ===== */
        .scenes-progress {
            position: fixed;
            top: 15px;
            right: 50%;
            transform: translateX(50%);
            z-index: 100;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .scene-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            border: 2px solid transparent;
        }

        .scene-dot.active {
            background: #00d2ff;
            border-color: #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            transform: scale(1.2);
        }

        .scene-dot.visited {
            background: #3a7bd5;
        }

        /* ===== STATUS INDICATOR ===== */
        .status-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            color: #b8cae0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            display: inline-block;
            animation: blink 1.5s infinite;
        }

        .status-dot.paused {
            background: #ff6b6b;
            animation: none;
        }

        .status-dot.slow {
            background: #ffd93d;
            animation: pulse-slow 1s infinite;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ===== SPEED INDICATOR ===== */
        .speed-indicator {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            font-size: 0.7rem;
            color: #ffd93d;
            font-family: monospace;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .speed-indicator.visible {
            opacity: 1;
        }

        /* ===== SCENE END NOTIFICATION ===== */
        .scene-end-notification {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            z-index: 100;
            background: rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(12px);
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            font-size: 0.8rem;
            color: #ffd93d;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
            font-weight: 500;
        }

        .scene-end-notification.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* ===== TIME DISPLAY ===== */
        .time-display {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.7rem;
            color: #8899bb;
            font-family: monospace;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .time-display.visible {
            opacity: 1;
        }

        /* ===== CONTENT (ABOVE VIDEO) ===== */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem 2rem;
            text-align: center;
            width: 100%;
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        /* ===== SECTION TEXT STYLES ===== */
        .section .scene-number {
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
            letter-spacing: 3px;
            opacity: 0;
            transition: all 0.6s ease;
        }

        .section.active .scene-number {
            opacity: 1;
        }

        .section h2 {
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 800;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(40px) scale(0.9);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .section h2 .highlight {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section .subtitle {
            font-size: 1.2rem;
            color: #00d2ff;
            font-weight: 600;
            opacity: 0;
            transform: translateX(-40px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
        }

        .section p {
            font-size: 1.1rem;
            max-width: 700px;
            line-height: 1.8;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateX(-60px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
            color: #d0d8e8;
        }

        .section .time-range {
            font-size: 0.8rem;
            color: #00d2ff;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 1rem;
            border-radius: 20px;
            margin-top: 0.5rem;
            border: 1px solid rgba(0, 210, 255, 0.15);
            opacity: 0;
            transition: all 0.8s ease 0.4s;
        }

        .section.active h2 {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .section.active .subtitle {
            opacity: 1;
            transform: translateX(0);
        }

        .section.active p {
            opacity: 1;
            transform: translateX(0);
        }

        .section.active .time-range {
            opacity: 1;
        }

        .section .scroll-hint {
            margin-top: 2rem;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #8899bb;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.4rem 1.5rem;
            border-radius: 60px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            animation: pulse 2s infinite;
            opacity: 0;
            transform: scale(0.7);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s;
        }

        .section.active .scroll-hint {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===== BUTTONS ===== */
        .section .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s;
        }

        .section.active .btn-group {
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            padding: 0.7rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff;
            box-shadow: 0 4px 25px rgba(0, 210, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(0, 210, 255, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: #e8edf5;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .btn-outline:hover {
            border-color: #00d2ff;
            color: #00d2ff;
            transform: translateY(-3px);
        }

        /* ===== ABOUT GRID ===== */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
        }

        .section.active .about-grid {
            opacity: 1;
            transform: translateY(0);
        }

        .about-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem 1.5rem;
            text-align: right;
        }

        .about-info .info-item {
            display: flex;
            gap: 0.6rem;
            font-size: 0.9rem;
            align-items: center;
        }

        .about-info .info-item i {
            color: #00d2ff;
            width: 18px;
        }

        .about-info .info-item strong {
            color: #e8edf5;
        }

        .about-info .info-item span {
            color: #8899bb;
        }

        /* ===== RESUME GRID ===== */
        .resume-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
        }

        .section.active .resume-grid {
            opacity: 1;
            transform: translateY(0);
        }

        .resume-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: right;
        }

        .resume-card h3 {
            color: #00d2ff;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .resume-item {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .resume-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .resume-item .title {
            font-weight: 700;
            color: #e8edf5;
        }

        .resume-item .company {
            color: #00d2ff;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .resume-item .date {
            color: #8899bb;
            font-size: 0.8rem;
        }

        .resume-item p {
            color: #a0b4d0;
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        /* ===== SERVICES GRID ===== */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
        }

        .section.active .services-grid {
            opacity: 1;
            transform: translateY(0);
        }

        .service-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .service-card:hover {
            border-color: rgba(0, 210, 255, 0.2);
            transform: translateY(-5px);
        }

        .service-card .icon {
            font-size: 2.5rem;
            color: #00d2ff;
            margin-bottom: 0.8rem;
        }

        .service-card h4 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .service-card p {
            font-size: 0.85rem;
            color: #a0b4d0;
        }

        /* ===== TESTIMONIALS ===== */
        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
        }

        .section.active .testimonials-grid {
            opacity: 1;
            transform: translateY(0);
        }

        .testimonial-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: right;
        }

        .testimonial-card .quote {
            color: #a0b4d0;
            font-size: 0.95rem;
            line-height: 1.8;
            font-style: italic;
            margin-bottom: 0.8rem;
        }

        .testimonial-card .author {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .testimonial-card .author .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
            font-weight: 700;
        }

        .testimonial-card .author .name {
            font-weight: 700;
        }

        .testimonial-card .author .title {
            color: #8899bb;
            font-size: 0.8rem;
        }

        /* ===== PORTFOLIO ===== */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
        }

        .section.active .portfolio-grid {
            opacity: 1;
            transform: translateY(0);
        }

        .portfolio-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            text-align: right;
        }

        .portfolio-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 210, 255, 0.2);
        }

        .portfolio-card .image {
            height: 150px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.15), rgba(58, 123, 213, 0.15));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .portfolio-card .info {
            padding: 1.2rem;
        }

        .portfolio-card .info h4 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }

        .portfolio-card .info .tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .portfolio-card .info .tags span {
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .portfolio-more {
            text-align: center;
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s;
        }

        .section.active .portfolio-more {
            opacity: 1;
            transform: translateY(0);
        }

        .portfolio-more p {
            color: #a0b4d0;
            margin-bottom: 0.8rem;
        }

        /* ===== CONTACT ===== */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
        }

        .section.active .contact-grid {
            opacity: 1;
            transform: translateY(0);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .contact-info .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.8rem 1.2rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .contact-info .info-item i {
            font-size: 1.2rem;
            color: #00d2ff;
            width: 30px;
        }

        .contact-info .info-item .text .label {
            font-size: 0.7rem;
            color: #8899bb;
        }

        .contact-info .info-item .text .value {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .contact-form {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .contact-form .form-group {
            margin-bottom: 1rem;
        }

        .contact-form label {
            display: block;
            margin-bottom: 0.2rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #e8edf5;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.05);
        }

        .contact-form textarea {
            resize: vertical;
            min-height: 100px;
        }

        .contact-form .btn {
            width: 100%;
            justify-content: center;
        }

        /* ===== FOOTER ===== */
        .footer-section {
            min-height: 30vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-section .social {
            display: flex;
            gap: 1.2rem;
            margin-bottom: 0.8rem;
        }

        .footer-section .social a {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0b4d0;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .footer-section .social a:hover {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff;
            transform: translateY(-3px);
        }

        .footer-section p {
            color: #8899bb;
            font-size: 0.9rem;
        }

        .footer-section .brand {

            const currentTimeText = document.getElementById('currentTimeText');
            const sceneEndNotification = document.getElementById('sceneEndNotification');
            const speedIndicator = document.getElementById('speedIndicator');

            // ============================================
            //  متغيرات التحكم
            // ============================================
            let currentSceneIndex = 0;
            let totalScenes = scenesData.length;
            let isScrolling = false;
            let scrollTimeout = null;
            let isVideoPlaying = false;
            let lastScrollY = window.scrollY;
            let currentVideoTime = 0;
            let isSlowMode = false;
            let originalPlaybackRate = 1.0;
            const slowModeDuration = 2;
            let isSceneEnded = false;
            let isLooping = false;

            // ============================================
            //  إنشاء الأقسام ونقاط التقدم
            // ============================================
            function createSections() {
                scenesData.forEach((scene, index) => {
                    const section = document.createElement('section');
                    section.className = 'section';
                    section.dataset.scene = index;

                    const sceneNumber = document.createElement('div');
                    sceneNumber.className = 'scene-number';
                    sceneNumber.textContent = `لقطة ${index + 1}/${totalScenes}`;
                    section.appendChild(sceneNumber);

                    const h2 = document.createElement('h2');
                    h2.innerHTML = scene.title;
                    section.appendChild(h2);

                    if (scene.subtitle) {
                        const subtitle = document.createElement('div');
                        subtitle.className = 'subtitle';
                        subtitle.textContent = scene.subtitle;
                        section.appendChild(subtitle);
                    }

                    const p = document.createElement('p');
                    p.textContent = scene.desc;
                    section.appendChild(p);

                    const timeRange = document.createElement('div');
                    timeRange.className = 'time-range';
                    timeRange.textContent = `⏱ ${scene.startTime.toFixed(1)}ث - ${scene.endTime.toFixed(1)}ث`;
                    section.appendChild(timeRange);

                    // إضافة المحتوى الإضافي
                    const contentWrapper = document.createElement('div');
                    contentWrapper.style.width = '100%';
                    contentWrapper.style.display = 'flex';
                    contentWrapper.style.flexDirection = 'column';
                    contentWrapper.style.alignItems = 'center';
                    contentWrapper.innerHTML = scene.content;
                    section.appendChild(contentWrapper);

                    if (index < totalScenes - 1) {
                        const hint = document.createElement('div');
                        hint.className = 'scroll-hint';
                        hint.textContent = scene.hint || '⬇️ مرر للأسفل ⬇️';
                        section.appendChild(hint);

                        endHint.className = 'scroll-hint';

                        section.appendChild(endHint);

                        `;
                        section.appendChild(footer);
                    }

                    content.appendChild(section);

                    const dot = document.createElement('div');
                    dot.className = 'scene-dot';
                    dot.dataset.index = index;
                    dot.title = `${scene.title.replace(/<[^>]*>/g, '')} (${scene.startTime.toFixed(1)}-${scene.endTime.toFixed(1)}ث)`;
                    dot.addEventListener('click', () => {
                        goToScene(index);
                    });
                    scenesProgress.appendChild(dot);
                });

            // ============================================
            //  الانتقال إلى لقطة محددة
            // ============================================
            function goToScene(index) {
                if (index < 0) index = 0;
                if (index >= totalScenes) index = totalScenes - 1;

                currentSceneIndex = index;
                const scene = scenesData[index];
                isSceneEnded = false;
                isLooping = false;

                sceneEndNotification.classList.remove('show');

                const progress = (index / (totalScenes - 1)) * 100;
                progressBar.style.width = progress + '%';

                const dots = document.querySelectorAll('.scene-dot');
                dots.forEach((dot, i) => {
                    dot.classList.remove('active', 'visited');
                    if (i === index) {
                        dot.classList.add('active');
                    } else if (i < index) {
                        dot.classList.add('visited');
                    }
                });

                const sections = document.querySelectorAll('.section');
                sections.forEach((section, i) => {
                    section.classList.toggle('active', i === index);
                });

                if (video.duration && scene.startTime < video.duration) {
                    video.currentTime = scene.startTime;
                    currentVideoTime = scene.startTime;
                    updateTimeDisplay(scene.startTime);
                    playVideoVerySlowFrom(scene.startTime);
                }
            }

            // ============================================
            //  تشغيل الفيديو بسرعة بطيئة جداً (0.15x)
            // ============================================
            function playVideoVerySlowFrom(time) {
                if (time < 0) time = 0;
                if (time > video.duration) time = video.duration;

                video.currentTime = time;
                currentVideoTime = time;
                updateTimeDisplay(time);

                originalPlaybackRate = video.playbackRate || 1.0;
                const verySlowRate = 0.15;
                video.playbackRate = verySlowRate;

                speedIndicator.textContent = `🐢 سرعة ${verySlowRate.toFixed(2)}x`;
                speedIndicator.classList.add('visible');

                video.play().then(() => {
                    isVideoPlaying = true;
                    isSlowMode = true;
                    isLooping = false;

                    statusDot.className = 'status-dot slow';
                    statusText.textContent = '🐢 تشغيل بطيء جداً';

                    setTimeout(() => {
                        if (isVideoPlaying && isSlowMode) {
                            video.playbackRate = originalPlaybackRate;
                            isSlowMode = false;
                            statusDot.className = 'status-dot';
                            statusText.textContent = '▶ تشغيل تلقائي';
                            speedIndicator.classList.remove('visible');
                        }
                    }, slowModeDuration * 1000);

                }).catch(err => {
                    console.warn('لا يمكن تشغيل الفيديو:', err);
                });
            }

            // ============================================
            //  تحديث عرض الوقت
            // ============================================
            function updateTimeDisplay(time) {
                const minutes = Math.floor(time / 60);
                const seconds = Math.floor(time % 60);
                currentTimeText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                timeDisplay.classList.add('visible');
                clearTimeout(window.timeDisplayTimeout);
                window.timeDisplayTimeout = setTimeout(() => {
                    timeDisplay.classList.remove('visible');
                }, 3000);
            }

            // ============================================
            //  إيقاف الفيديو
            // ============================================
            function pauseVideo() {
                if (isVideoPlaying) {
                    currentVideoTime = video.currentTime;
                    video.pause();
                    isVideoPlaying = false;
                    isSlowMode = false;
                    isLooping = false;
                    video.playbackRate = originalPlaybackRate;
                    statusDot.className = 'status-dot paused';
                    statusText.textContent = `⏸ توقف عند ${currentVideoTime.toFixed(1)}ث`;
                    updateTimeDisplay(currentVideoTime);
                    speedIndicator.classList.remove('visible');
                }
            }

            // ============================================
            //  مراقبة الفيديو - إعادة تشغيل اللقطة عند انتهائها
            // ============================================
            video.addEventListener('timeupdate', function() {
                if (isVideoPlaying && !video.paused) {
                    currentVideoTime = video.currentTime;

                    if (video.duration) {
                        const progress = (video.currentTime / video.duration) * 100;
                        progressBar.style.width = Math.min(progress, 100) + '%';
                    }

                    const currentScene = scenesData[currentSceneIndex];
                    if (currentScene) {
                        if (video.currentTime >= currentScene.endTime) {
                            if (!isLooping) {
                                isLooping = true;
                                isSceneEnded = true;

                                sceneEndNotification.classList.add('show');
                                sceneEndNotification.textContent = '🔄 إعادة تشغيل اللقطة';

                                setTimeout(() => {
                                    if (isVideoPlaying) {
                                        video.currentTime = currentScene.startTime;
                                        currentVideoTime = currentScene.startTime;
                                        updateTimeDisplay(currentScene.startTime);
                                        isLooping = false;
                                        isSceneEnded = false;
                                        sceneEndNotification.classList.remove('show');
                                        video.play().catch(err => console.warn('خطأ في إعادة التشغيل:', err));
                                    }
                                }, 300);
                            }
                        }
                    }
                }
            });

            // ============================================
            //  معالجة التمرير
            // ============================================
            window.addEventListener('scroll', function() {
                const currentScrollY = window.scrollY;
                const scrollDelta = Math.abs(currentScrollY - lastScrollY);

                if (scrollDelta > 3) {
                    isScrolling = true;

                    if (isVideoPlaying) {
                        pauseVideo();
                    }

                    updateSceneFromScroll(currentScrollY);

                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => {
                        isScrolling = false;

                        if (video.duration && currentSceneIndex < scenesData.length) {
                            const scene = scenesData[currentSceneIndex];
                            if (scene.startTime < video.duration) {
                                isLooping = false;
                                isSceneEnded = false;
                                sceneEndNotification.classList.remove('show');
                                playVideoVerySlowFrom(scene.startTime);
                            }
                        }
                    }, 400);
                }

                lastScrollY = currentScrollY;
            });

            // ============================================
            //  تحديث اللقطة بناءً على التمرير
            // ============================================
            function updateSceneFromScroll(scrollY) {
                const sections = document.querySelectorAll('.section');
                let activeIndex = 0;

                sections.forEach((section, index) => {
                    const rect = section.getBoundingClientRect();
                    const isActive = rect.top <= window.innerHeight * 0.5 && rect.bottom >= window.innerHeight * 0.3;

                    if (isActive) {
                        activeIndex = index;
                    }
                });

                if (activeIndex !== currentSceneIndex) {
                    currentSceneIndex = activeIndex;

                    sections.forEach((section, i) => {
                        section.classList.toggle('active', i === activeIndex);
                    });

                    const dots = document.querySelectorAll('.scene-dot');
                    dots.forEach((dot, i) => {
                        dot.classList.remove('active');
                        if (i === activeIndex) {
                            dot.classList.add('active');
                        } else if (i < activeIndex) {
                            dot.classList.add('visited');
                        }
                    });

                    const progress = (activeIndex / (totalScenes - 1)) * 100;
                    progressBar.style.width = progress + '%';

                    isLooping = false;
                    isSceneEnded = false;
                    sceneEndNotification.classList.remove('show');
                }
            }

            // ============================================
            //  تهيئة الفيديو
            // ============================================
            video.addEventListener('loadedmetadata', function() {
                console.log('✅ الفيديو جاهز، الطول:', video.duration, 'ثانية');
                originalPlaybackRate = video.playbackRate || 1.0;
                currentVideoTime = 0;

                createSections();

                setTimeout(() => {
                    goToScene(0);
                }, 500);
            });

            // ============================================
            //  أحداث إضافية
            // ============================================
            window.addEventListener('resize', function() {
                updateSceneFromScroll(window.scrollY);
            });

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && !isScrolling) {
                    const scene = scenesData[currentSceneIndex];
                    if (scene && !isSceneEnded) {
                        if (isSlowMode) {
                            playVideoVerySlowFrom(currentVideoTime);
                        } else {
                            playVideoVerySlowFrom(scene.startTime);
                        }
                    }
                }
            });

            video.addEventListener('error', function(e) {
                console.error('خطأ في الفيديو:', e);
                statusText.textContent = '⚠ خطأ في الفيديو';
                statusDot.className = 'status-dot paused';
            });

            // ============================================
            //  نموذج الاتصال
            // ============================================
            document.addEventListener('submit', function(e) {
                if (e.target.id === 'contactForm') {
                    e.preventDefault();
                    const btn = e.target.querySelector('.btn');
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
                    btn.disabled = true;

                    setTimeout(() => {
                        btn.innerHTML = '<i class="fas fa-check"></i> تم الإرسال!';
                        btn.style.background = 'linear-gradient(135deg, #00ff88, #00b894)';
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                            btn.style.background = '';
                            btn.disabled = false;
                            e.target.reset();
                        }, 2000);
                    }, 1500);
                }
            });

            console.log('🚀 موقع محمد الحناني - Full-Stack Developer مع خلفية فيديو تفاعلية');
            console.log('📌 اللقطات المحددة:');
            scenesData.forEach((scene, i) => {
                console.log(`  لقطة ${i + 1}: ${scene.startTime}ث - ${scene.endTime}ث`);
            });
            console.log('🐢 سرعة التشغيل البطيء: 0.15x');
            console.log('🔄 إعادة تشغيل تلقائي عند انتهاء كل لقطة');
        });
    </script>

</body>
</html>
